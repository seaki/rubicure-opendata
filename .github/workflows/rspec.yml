name: RSpec

on:
  push:
    branches: [master, ruby-3.2]
  pull_request:
    branches: [master, ruby-3.2]

permissions:
  contents: read

jobs:
  rspec:
    name: rspec (${{ matrix.ruby }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Each entry is a directory under ci/ whose Dockerfile pins the Ruby image (kept up to date by Dependabot)
        ruby: [ruby3.2]
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t rspec-${{ matrix.ruby }} ci/${{ matrix.ruby }}

      - uses: actions/cache@v6
        with:
          path: vendor/bundle
          key: bundle-${{ matrix.ruby }}-${{ hashFiles(format('ci/{0}/Dockerfile', matrix.ruby)) }}-${{ hashFiles('Gemfile.lock') }}
          restore-keys: bundle-${{ matrix.ruby }}-${{ hashFiles(format('ci/{0}/Dockerfile', matrix.ruby)) }}-

      - name: Run RSpec
        run: >-
          docker run --rm -v "$PWD:/app" -w /app -e BUNDLE_PATH=vendor/bundle
          rspec-${{ matrix.ruby }}
          sh -c "ruby -v && bundle install --jobs 4 && bundle exec rspec"
