version: 2
updates:
- package-ecosystem: bundler
  directory: "/"
  schedule:
    interval: daily
- package-ecosystem: docker
  directory: "/"
  schedule:
    interval: daily
  ignore:
  - dependency-name: ruby
    versions:
    - ">= 3.2"
- package-ecosystem: docker
  directory: "/ci/ruby3.1"
  schedule:
    interval: daily
  ignore:
  - dependency-name: ruby
    versions:
    - ">= 3.2"
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: daily
